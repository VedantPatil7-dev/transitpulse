<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitPulse | Central Control Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #0b0c10;">

    <!-- 🔑 DESIGNED STANDALONE LOGIN SCREEN -->
    <div id="admin-login-card" class="card glass-card" style="width: 100%; max-width: 420px; padding: 2.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <span style="font-size: 3rem;">🔒</span>
            <h2 style="margin-top: 0.5rem; font-weight: 700; color: #fff;">Command Center</h2>
            <p style="color: #9ca3af; font-size: 0.9rem; margin-top: 0.25rem;">Authorized Personnel Terminal Access</p>
        </div>
        
        <div id="login-error" style="color: var(--accent-red); margin-bottom: 1.25rem; font-weight: 600; text-align: center; font-size: 0.95rem;"></div>
        
        <div class="input-group">
            <label>Operator Username ID</label>
            <input type="text" id="admin-user" placeholder="Enter ID..." style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glow); border-radius: 8px; color: #fff; font-size: 1rem; outline: none;">
        </div>
        
        <div class="input-group" style="margin-bottom: 2rem;">
            <label>Security Password</label>
            <input type="password" id="admin-pass" placeholder="Enter Password..." style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glow); border-radius: 8px; color: #fff; font-size: 1rem; outline: none;">
        </div>
        
        <button class="btn-primary" onclick="loginAdmin()" style="padding: 14px; font-size: 1rem; letter-spacing: 0.5px;">Verify Credentials</button>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" style="color: #9ca3af; text-decoration: none; font-size: 0.85rem; transition: 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#9ca3af'">➔ Return to Commuter Portal</a>
        </div>
    </div>

    <!-- 📊 SECURE NETWORK PANEL (Hidden by default, styled to occupy full center view upon login) -->
    <div id="admin-control-dashboard" class="card glass-card" style="display: none; width: 90%; max-width: 1000px; margin: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-glow); padding-bottom: 1rem;">
            <div>
                <h1 style="color: #fff;">Central Control Dashboard</h1>
                <p style="color: #9ca3af; font-size: 0.9rem;">Live Track Interventions & Blockage Simulators</p>
            </div>
            <button class="nav-btn" style="background: rgba(207, 102, 121, 0.15); color: var(--accent-red); font-weight: 600; padding: 10px 20px; border: 1px solid rgba(207,102,121,0.3);" onclick="logoutAdmin()">Secure Logout</button>
        </div>
        
        <div class="table-wrapper" style="background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-glow);">
            <table>
                <thead>
                    <tr style="background: rgba(255,255,255,0.02);">
                        <th>Station ID</th>
                        <th>Station Name</th>
                        <th>Metro Line</th>
                        <th>Current State</th>
                        <th>Command Action</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Dynamic Station Management Rows Injected Here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
